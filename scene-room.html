<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>多机位场景融合试验</title><style>body{margin:0;background:#111;color:white;font:14px system-ui}#tools{position:absolute;z-index:100;top:12px;left:12px;padding:14px;border-radius:10px;background:#18212eef;max-width:390px}h1{font-size:17px}button{margin:3px;padding:6px}a{color:#9cdeff;margin-right:10px}p{margin:8px 0}</style>
<div id="tools"><h1 id="title">多机位场景</h1><p><a id="current">优化版</a><a id="initial">初始融合</a><a id="report">验证报告</a></p><div id="positions"></div><p>W/S 前后 · A/D 平移 · Q 上升 / E 下降</p><p id="status" role="status">加载中…</p><p>实验模型；局部重影与未观测区域仍可能有缺损。</p><a id="download" download>下载 PLY</a></div>
<script type="importmap">{"imports":{"three":"/three.js"}}</script><script type="module">
import * as THREE from 'three';import {Viewer,RenderMode,SceneRevealMode} from './gaussian.js';import {installRoomNavigation} from './room-navigation.js';import {installRoomSortRefresh} from './room-sorting.js';
import {installRoomLook,setRoomLook} from './room-look.js';
const query=new URLSearchParams(location.search),scene=query.get('scene')||'six-20261112';
if(!/^[a-zA-Z0-9_-]+$/.test(scene))throw Error('Invalid scene ID');
const root='/four-room/scenes/'+scene,initial=query.get('version')==='initial';
const standardDisplay=query.get('quality')==='standard';
const qualityControl=document.createElement('p');
for(const [value,label] of [['hd','高清显示'],['standard','标准显示']]){const a=document.createElement('a'),url=new URL(location.href);url.searchParams.set('quality',value);a.href=url.href;a.textContent=label+((value==='standard')===standardDisplay?' ✓':'');qualityControl.appendChild(a)}
document.querySelector('#tools').appendChild(qualityControl);
document.querySelector('#initial').href='?scene='+scene+'&version=initial';document.querySelector('#current').href='?scene='+scene;document.querySelector('#report').href='/scene-report.html?scene='+scene;
try{
 const meta=await(await fetch(root+'/fusion.json')).json(),data=await(await fetch(root+'/data-512/dataset.json')).json();
 const optimized=!initial&&meta.optimized===true,base=optimized?root+'/'+meta.model_folder:root;
 const filename=optimized?'fused':'initial';document.querySelector('#download').href=base+'/'+filename+'.ply';
 document.querySelector('#title').textContent=meta.preview_title||meta.stations.length+'机位 · 场景融合试验';
 if(meta.preview_note){const note=document.createElement('p');note.textContent=meta.preview_note;document.querySelector('#tools').appendChild(note)}
 if(meta.report_page==='tour-distill-report.html')document.querySelector('#report').href='/tour-distill-report.html?scene='+scene;
 if(meta.reference_scene&&/^[a-zA-Z0-9_-]+$/.test(meta.reference_scene)){document.querySelector('#initial').href='?scene='+meta.reference_scene+'&inspect=3';document.querySelector('#initial').textContent=meta.reference_label||'修复前对照'}
 if(meta.native_scene&&/^[a-zA-Z0-9_-]+$/.test(meta.native_scene)){document.querySelector('#initial').href='/native-tour-room.html?scene='+meta.native_scene;document.querySelector('#initial').textContent='原始漫游对照'}
 if([.30,.38,.44,.49].includes(meta.tour_core)&&meta.native_scene)document.querySelector('#initial').href+='&range='+meta.tour_core;
 if(meta.comparison_scene&&/^[a-zA-Z0-9_-]+$/.test(meta.comparison_scene)){const a=document.createElement('a');a.href='?scene='+meta.comparison_scene+'&inspect=3&quality=hd';a.textContent='旧单一 PLY 对照';document.querySelector('#report').after(a)}
 const centers=meta.centers.map(p=>new THREE.Vector3(...p)),up=new THREE.Vector3(...meta.up),target=centers.reduce((s,c)=>s.add(c),new THREE.Vector3()).multiplyScalar(1/centers.length).addScaledVector(up,-.5);
 const shDegree=optimized?(meta.sh_degree||0):0;
 if(![0,1,2].includes(shDegree))throw Error('当前播放器仅支持到二阶球谐颜色');
 const viewer=new Viewer({cameraUp:meta.up,initialCameraPosition:centers[0].toArray(),initialCameraLookAt:target.toArray(),sharedMemoryForWorkers:false,integerBasedSort:true,gpuAcceleratedSort:false,ignoreDevicePixelRatio:standardDisplay,enableOptionalEffects:true,sphericalHarmonicsDegree:shDegree,renderMode:RenderMode.OnChange,sceneRevealMode:SceneRevealMode.Instant});
 const alphaThreshold=Number.isInteger(meta.splat_alpha_threshold)&&meta.splat_alpha_threshold>=0&&meta.splat_alpha_threshold<=255?meta.splat_alpha_threshold:3;
 await viewer.addSplatScenes([{path:base+'/'+filename+(shDegree?'.ply':'.splat'),splatAlphaRemovalThreshold:alphaThreshold}],true);viewer.start();
 const sortRefresh=installRoomSortRefresh(viewer);window.roomSortRefresh=sortRefresh;
 window.addEventListener('pagehide',()=>sortRefresh.dispose(),{once:true});
 let movement=0;const panel=document.querySelector('#positions');const button=(label,action)=>{const b=document.createElement('button');b.textContent=label;b.onclick=action;panel.appendChild(b)};
 const go=point=>{const token=++movement,from=viewer.camera.position.clone(),start=performance.now();const tick=()=>{if(token!==movement)return;const t=Math.min(1,(performance.now()-start)/1100),e=t*t*t*(10-15*t+6*t*t),next=from.clone().lerp(point,e),delta=next.clone().sub(viewer.camera.position);viewer.camera.position.copy(next);viewer.controls.target.add(delta);viewer.controls.update();viewer.forceRenderNextFrame();if(t<1)requestAnimationFrame(tick)};requestAnimationFrame(tick)};
 const labels=meta.station_labels||meta.stations;
 centers.forEach((c,i)=>button(labels[i]+'号机位',()=>go(c)));
 panel.appendChild(document.createElement('br'));data.midpoint_edges.forEach(([i,j])=>button(labels[i]+'–'+labels[j]+'中点',()=>go(centers[i].clone().lerp(centers[j],.5))));
 const disposeLook=installRoomLook({camera:viewer.camera,controls:viewer.controls,element:viewer.renderer.domElement,render:()=>viewer.forceRenderNextFrame(),onStart:()=>movement++});
 window.addEventListener('pagehide',disposeLook,{once:true});
 const inspect=i=>{const v=data.views[i];movement++;viewer.camera.position.fromArray(v.center);setRoomLook(viewer.camera,viewer.controls,new THREE.Vector3(...v.basis.map(row=>row[2])));viewer.forceRenderNextFrame()};
 const lookFromHere=face=>{movement++;const nearest=centers.reduce((best,c,i)=>c.distanceToSquared(viewer.camera.position)<centers[best].distanceToSquared(viewer.camera.position)?i:best,0),v=data.views.find(v=>v.source===nearest&&v.name.endsWith('-'+face));if(!v)return;setRoomLook(viewer.camera,viewer.controls,new THREE.Vector3(...v.basis.map(row=>row[2])));viewer.forceRenderNextFrame()};
 panel.appendChild(document.createElement('br'));button('向下检查',()=>lookFromHere(5));button('向上检查',()=>lookFromHere(4));button('水平视向',()=>lookFromHere(3));
 installRoomNavigation({camera:viewer.camera,controls:viewer.controls,onMove:()=>movement++,render:()=>viewer.forceRenderNextFrame()});
 viewer.controls.addEventListener('start',()=>movement++);window.roomViewer=viewer;window.inspectRoom=inspect;window.sceneMeta=meta;
 document.querySelector('#status').textContent='已加载 · '+meta.stations.length+'机位 · '+(optimized?(meta.preview_status||'联合优化'):'初始融合');
 if(query.has('inspect'))inspect(Number(query.get('inspect')));
}catch(e){document.querySelector('#status').textContent='加载失败：'+e.message;console.error(e)}
</script></html>
